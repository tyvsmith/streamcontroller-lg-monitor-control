name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - name: Read tag version
        id: version
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          if [[ "$version" == "$tag" ]]; then
            echo "Tag must start with v" >&2
            exit 1
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag version must be numeric semver (x.y.z)" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Lint
        run: uv run --only-group ci ruff check .

      - name: Format check
        run: uv run --only-group ci ruff format --check .

      - name: Type check
        run: uv run --only-group ci pyright

      - name: Test
        run: uv run --only-group ci pytest tests/ -v

      - name: Build release artifacts
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: uv run --only-group ci python scripts/build_release.py --version "$RELEASE_VERSION" --output-dir dist/release

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/release/*.zip dist/release/*.sha256 --verify-tag --title "LG Monitor Controls $GITHUB_REF_NAME" --notes-file dist/release/RELEASE_NOTES.md
